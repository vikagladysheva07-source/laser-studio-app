<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Epil Studio">
<title>Epil Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* палитра дашборда-образца (lumi airy): розовый, сирень, персик на светлом розово-сиреневом фоне */
  --bg:#F6EEF6; --card:#FFFFFF; --ink:#231B2E; --mut:#8C8497; --line:#F0E6F0; --soft:#FAF5FA;
  --esp:#EC4C93; --mocha:#D63F84; --taupe:#8E7CF0; --sand:#F8C9DD; --blush:#F9D3E5; --blush-s:#FCE8F2;
  --lil:#8E7CF0; --lil-s:#EEEBFD; --pch:#F2864E; --pch-s:#FDEFE6;
  --ok:#2E9E6B; --ok-s:#E3F5EC; --wrn:#C98A12; --wrn-s:#FBF1DC; --bad:#D64545; --bad-s:#FCE9E9;
  --r:20px; --sh:0 1px 2px rgba(60,30,70,.04),0 10px 28px rgba(90,40,100,.07);
  --serif:Manrope,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;background:radial-gradient(1100px 600px at 0% -10%,#EFE2F8 0,transparent 60%),radial-gradient(900px 520px at 100% 0,#FCE3EE 0,transparent 55%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{flex:none}
a{color:inherit;text-decoration:none}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700} .serif{font-family:var(--serif);font-variant-numeric:lining-nums}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:12px} .grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.flat{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:14px}
.h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.link{color:var(--mocha);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.bl{background:var(--blush-s);border-color:transparent;color:var(--mocha)}
.chip.ok{background:var(--ok-s);border-color:transparent;color:var(--ok)}
.chip.wrn{background:var(--wrn-s);border-color:transparent;color:var(--wrn)}
.chip.bad{background:var(--bad-s);border-color:transparent;color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;border:1px solid var(--line);background:#fff;transition:.15s}
.btn:hover{border-color:#E6D6E6}
.btn.dk{background:var(--esp);color:#fff;border-color:var(--esp)}
.btn.dk:hover{background:#DD3F86}
.btn.sm{min-height:38px;padding:0 15px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);position:relative}
.ib .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--taupe)}
.bar{height:5px;border-radius:5px;background:#F6E6EF;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#F59AC2,var(--esp))}
.ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--blush-s);color:var(--mocha);flex:none}
.in{width:100%;min-height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;outline:none}
.in:focus{border-color:var(--taupe)}
textarea.in{padding:10px 14px}
.hr{height:1px;background:var(--line)}
/* «фото»-заглушки: Таня заменит своими снимками кабинета, аппарата, рук */
.ph{position:relative;overflow:hidden;background:linear-gradient(140deg,#FBDDEB 0%,#F4A9CB 55%,#E5779F 100%);color:rgba(255,255,255,.85);display:grid;place-items:center}
.ph:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 30% 25%,rgba(255,255,255,.55),transparent 70%),radial-gradient(50% 40% at 80% 90%,rgba(120,60,140,.22),transparent 70%)}
.ph>*{position:relative}
.ph.v2{background:linear-gradient(140deg,#F6E3F7,#D9C2F2 55%,#A995EC)}
.ph.v3{background:linear-gradient(140deg,#FFE9DD,#FBC2A3 55%,#F2905E)}
.ph.v4{background:linear-gradient(140deg,#FCD6E8,#F38DBA 55%,#E2508F)}
.ph.v5{background:linear-gradient(140deg,#EDE6FD,#C5B8F6 55%,#9783EE)}
.ph.v6{background:linear-gradient(140deg,#FDE4EE,#F7B6CF 55%,#EE7FAA)}
.thumb{width:64px;height:64px;border-radius:14px;flex:none}
.splash{position:relative;overflow:hidden;background:radial-gradient(80% 50% at 15% 10%,#FBD3E5 0,transparent 70%),radial-gradient(70% 45% at 95% 35%,#E3DBFD 0,transparent 70%),radial-gradient(60% 40% at 50% 100%,#FDE3EE 0,transparent 70%),#FBF5FA}
.splash:before{content:"";position:absolute;left:50%;top:22%;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(circle,rgba(236,76,147,.14),transparent 70%)}
.splash>*{position:relative}
.ph.pi{background-size:cover;background-position:center;background-color:#F4C6DA}
.ph.pi:before{display:none}
.banner.pi:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(120,25,75,.62),rgba(120,25,75,.1) 75%)}
.banner>*{z-index:1}

/* полоса демо */
.demo{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(246,238,246,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{min-height:34px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--esp);color:#fff}

/* ===== приложение клиента ===== */
.phone{max-width:430px;margin:0 auto;min-height:calc(100vh - 55px);padding:16px 18px 104px;position:relative}
.phone.full{padding:0 0 110px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);display:flex;justify-content:space-around;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:#B1AABC}
.tabbar button.on{color:var(--esp)}
.nb{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.nb .t{font-weight:700;font-size:17px}
.logo-s{font-size:24px;font-weight:800;letter-spacing:-.02em}
.search{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--mut);font-size:14px;width:100%}
.search input{border:0;outline:none;background:none;flex:1;min-width:0}
.banner{display:flex;border-radius:22px;min-height:150px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.banner .t{color:#fff;font-weight:700;font-size:18px;line-height:1.25;max-width:62%;text-shadow:0 1px 8px rgba(120,30,80,.25)}
.banner .btn{min-height:34px;font-size:13px;padding:0 14px;color:var(--esp);border:0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;text-align:center}
.cats button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#5A5266}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.hs::-webkit-scrollbar{display:none}
.pcard{flex:none;width:156px;background:#fff;border-radius:18px;box-shadow:var(--sh);overflow:hidden;text-align:left}
.pcard .ph{height:116px}
.pcard div.t{padding:10px 12px 12px}
.srow{display:flex;align-items:center;gap:14px;padding:10px;background:#fff;border-radius:18px;box-shadow:var(--sh);text-align:left;width:100%}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -18px;padding:0 18px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;min-height:36px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:#5A5266}
.fchips button.on{background:var(--esp);border-color:var(--esp);color:#fff}
.hero{height:330px;border-radius:0 0 0 0}
.hero .ib{position:absolute;top:16px;color:var(--ink);border:0}
.sheet{background:#fff;border-radius:26px 26px 0 0;margin-top:-28px;position:relative;padding:22px 18px 0;min-height:200px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mcal span{font-size:11px;color:var(--mut);padding:6px 0}
.mcal button{width:100%;max-width:40px;aspect-ratio:1;margin:0 auto;border-radius:50%;font-weight:600;font-size:14px;padding:0}
.mcal button.off{color:#CEC6D4;pointer-events:none}
.mcal button.due{box-shadow:inset 0 0 0 1px var(--taupe)}
.mcal button.on{background:var(--esp);color:#fff;box-shadow:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{min-height:42px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.slot.on{background:var(--esp);border-color:var(--esp);color:#fff}
.irow{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:14px}
.irow svg{color:var(--mocha)}
.segc{display:flex;background:#F3EAF3;border-radius:999px;padding:4px}
.segc button{flex:1;min-height:38px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut)}
.segc button.on{background:var(--esp);color:#fff}
.menu .mi{display:flex;align-items:center;gap:14px;padding:15px 4px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px;font-weight:600}
.menu .mi:first-child{border-top:0}
.menu .mi svg{color:var(--mocha)}
.badge{min-width:20px;height:20px;border-radius:10px;background:#D86B5C;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.okc{width:108px;height:108px;border-radius:50%;background:var(--esp);color:#fff;display:grid;place-items:center;position:relative;margin:0 auto}
.conf{position:absolute;width:5px;height:16px;border-radius:3px}
.sw{width:46px;height:28px;border-radius:20px;background:#EADFEA;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.2s}
.sw.on{background:var(--esp)} .sw.on:after{left:21px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sand)} .dots i.on{background:var(--esp)}

/* ===== кабинет Тани ===== */
.adm{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 55px)}
.side{padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:55px;height:calc(100vh - 55px);background:rgba(255,255,255,.55);border-right:1px solid var(--line)}
.alogo{display:flex;align-items:center;gap:10px;padding:0 10px 24px;color:var(--mocha)}
.alogo b{font-size:20px;font-weight:800;color:var(--ink)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:600;color:#5A5266;position:relative;text-align:left;width:100%}
.nav:hover{background:#fff}
.nav.on{background:var(--blush-s);color:var(--mocha)}
.nav.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--esp)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px;background:var(--blush-s);color:var(--mocha)}
.nav.on .cnt{background:#fff;color:var(--mocha)}
.main{padding:26px 28px 40px;min-width:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe)}
.atitle{font-size:30px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
.ahero{display:flex;height:190px;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;margin:18px 0}
.ahero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(90,25,65,.55),rgba(90,25,65,.12) 70%,transparent)}
.ahero>*{z-index:1}
.ahero .t{font-size:34px;font-weight:800;color:#fff;line-height:1;text-shadow:0 2px 14px rgba(110,30,80,.25)}
.ahero .s{color:rgba(255,255,255,.92);font-size:14px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.tile{background:#fff;border-radius:16px;border:1px solid var(--line);padding:14px 16px;text-align:left}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:lining-nums}
.tile .l{font-size:12px;color:var(--mut);margin-top:2px}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.g4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.tm{font-weight:800;font-size:14px;width:48px;flex:none}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:12px 10px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
.tbl th{font-size:12px;color:var(--mut);font-weight:600;border-top:0}
.tbl tr.cl{cursor:pointer} .tbl tr.cl:hover td{background:var(--soft)}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:16px;background:var(--blush-s);color:var(--mocha);flex:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:#5A5266}
.tabs button.on{background:var(--esp);border-color:var(--esp);color:#fff}
.msg{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;white-space:pre-wrap;outline:none}
/* недельный календарь */
.wk{overflow-x:auto;border-radius:20px;background:#fff;box-shadow:var(--sh)}
.wkg{display:grid;grid-template-columns:54px repeat(6,minmax(120px,1fr));min-width:780px}
.wkh{position:sticky;top:0;background:#fff;z-index:2;padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);font-weight:600}
.wkh b{display:block;font-size:18px;color:var(--ink);font-weight:800}
.wkh.td{color:var(--mocha)} .wkh.td b{color:#fff;background:var(--esp);width:34px;height:34px;border-radius:50%;margin:2px auto 0;display:grid;place-items:center;font-family:Manrope;font-size:15px}
.wkt{position:relative;border-right:1px solid var(--line)}
.wkt span{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-50%)}
.wkc{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 60px}
.wkc:last-child{border-right:0}
.blk{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:11px;line-height:1.25;overflow:hidden;text-align:left;background:var(--blush-s);border-left:3px solid var(--esp);color:var(--ink)}
.blk b{font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.new{background:#fff;border:1px dashed var(--taupe);border-left:3px solid var(--taupe)}
.blk.done{background:#F2EEF4;border-left-color:#C2B9CB;color:#7F778A}
.blk.noshow{background:var(--bad-s);border-left-color:var(--bad)}
/* модалка */
.ov-m{position:fixed;inset:0;background:rgba(35,27,46,.3);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:24px;width:min(540px,100%);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(40,25,20,.2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--esp);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--sh);max-width:calc(100% - 32px)}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:26px}
.show-m{display:none}
.gauge text{font-family:Manrope}

/* как приложение на телефоне */
html{-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
button,a,.srow,.pcard{touch-action:manipulation;transition:transform .15s ease,background .15s,box-shadow .15s}
button:active,.srow:active,.pcard:active,.card[data-act]:active{transform:scale(.97)}
.btn.dk{background:linear-gradient(135deg,#F2639F,#E4408A);border:0;box-shadow:0 8px 20px rgba(236,76,147,.28)}
.scr{animation:scrIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:22;display:flex;align-items:center;gap:14px}
.cta .btn{flex:1;max-width:220px;margin-left:auto}
.phone.full{padding:0 0 110px}
.ci{box-shadow:inset 0 0 0 1px rgba(236,76,147,.14)}
.cats .ci{width:60px;height:60px}
.ci.cph{width:60px;height:60px;background-size:cover;background-position:center;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #F6BFD7,0 6px 14px rgba(236,76,147,.18)}
.cardw{perspective:1400px}
.club3d{position:relative;aspect-ratio:1.586;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.club3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#fff;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;
  background:repeating-radial-gradient(circle at 88% 118%,rgba(255,255,255,.055) 0 1px,transparent 1px 8px),radial-gradient(120% 90% at 0% 0%,#5B2450 0%,transparent 60%),linear-gradient(135deg,#1F1024 0%,#3A1636 50%,#6B2453 100%);
  box-shadow:0 22px 44px rgba(60,15,50,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.face:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,235,245,.16) 48%,rgba(200,180,255,.10) 52%,transparent 65%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:120% 0}50%{background-position:-20% 0}}
.face>*{position:relative;z-index:1}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding:0}
.rg{background:linear-gradient(100deg,#FBE6DA 0%,#E6A99B 35%,#FFF1E8 55%,#D99486 80%,#F6D3C4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chipc{width:42px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FCE3D6,#E2A493 45%,#F7D2C3 70%,#C98374);box-shadow:inset 0 0 0 1px rgba(120,50,40,.25);position:relative}

/* ===== премиальный слой: жемчужный фон, слива и розовое золото, парящее меню ===== */

/* ===================== ДИЗАЙН-СИСТЕМА v2 «Жемчуг и слива» (17.11) =====================
   База почти белая, глубина — слоями и тенями, стекло только у парящих элементов
   (меню, верхняя панель, нижняя кнопка, шторки). Сплошной цвет — только тёмная слива у главных
   действий и клубных плашек; розовый — точечно: индикаторы, прогресс, бейджи. */
:root{
 --bg:#F8F5F4;--card:#FFFFFF;--ink:#1D1519;--ink2:#3E3038;--mut:#8C8186;--line:#EFE8E7;--soft:#FBF8F7;
 --esp:#2A1A24;--mocha:#A93A68;--taupe:#C9A99B;--sand:#EADCDD;--blush:#F3E2E8;--blush-s:#F9EFF2;
 --accent:#D4477F;--accent-s:#FBEEF3;--plum:#2A1A24;
 --sh1:0 1px 2px rgba(29,21,25,.04),0 2px 6px -2px rgba(29,21,25,.05);
 --sh2:0 1px 2px rgba(29,21,25,.04),0 14px 30px -14px rgba(29,21,25,.16);
 --sh3:0 2px 6px rgba(29,21,25,.05),0 26px 50px -18px rgba(29,21,25,.28);
 --sh:var(--sh2);--glass:rgba(255,255,255,.74);
}
body{background:radial-gradient(700px 320px at 50% -160px,#F6E7EC 0,transparent 70%),var(--bg);color:var(--ink);letter-spacing:-.005em}
.mut{color:var(--mut)}

.link{color:var(--mocha);font-weight:600}
.card,.srow,.nt{background:#fff!important;border:0!important;box-shadow:var(--sh2)!important;border-radius:22px}
.flat,.tile{background:#fff;border:1px solid var(--line);box-shadow:var(--sh1)}
.tile .v{font-weight:700;letter-spacing:-.03em}
.search{background:#fff;border:1px solid var(--line);box-shadow:var(--sh1)}
.in{background:#fff;border-color:var(--line)}
.btn{min-height:50px;border-radius:16px;font-weight:600;font-size:15px;background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:var(--sh1)}
.btn.sm{min-height:38px;border-radius:12px;font-size:13px}
.btn.dk{background:var(--esp)!important;color:#fff;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 12px 24px -12px rgba(42,26,36,.7)!important}
.btn.dk:hover{background:#3A2632!important}
.btn.lt{background:#fff;color:var(--esp);border:0;box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}
.btn.ghost{background:rgba(255,255,255,.1)!important;color:#fff!important;border:1px solid rgba(255,255,255,.25)!important;box-shadow:none!important}
.chip{border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:600}
.chip.bl{background:var(--accent-s);color:var(--mocha);border-color:transparent}
.chip.on{background:var(--esp)!important;color:#fff;border-color:transparent}
.ci{background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}

<script>
/* ---------- утилиты ---------- */
const pad=n=>String(n).padStart(2,'0');
const T=new Date();T.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dd=(a,b)=>Math.round((pd(a)-pd(b))/864e5);

   ${nav.map(([k,i,t,sh])=>`<button class="nav ${U.av===k?'on':''}" data-act="av" data-v="${k}">${ic(i,U.av===k?21:20,U.av===k?2:1.7)}<span class="hide-m">${t}</span><span class="show-m">${sh}</span>${k==='msg'&&lcount(L)?`<span class="cnt">${lcount(L)}</span>`:''}${k==='sch'&&req?`<span class="cnt">${req}</span>`:''}</button>`).join('')}
   <div class="side-foot"><button class="nav" data-act="mode" data-v="client">${ic('user',20)}<span>Вид клиента</span></button><button class="nav" data-act="logout">${ic('left',20)}<span>Выйти</span></button></div>
  </aside><main class="main">${body()}<button class="fab" data-act="newAppt" aria-label="Новая запись">${ic('plus',26,2)}</button></main></div>`;
}

function centerStrip(){document.querySelectorAll('.dstrip').forEach(st=>{const on=st.querySelector('.db.on');if(on)st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.clientWidth/2})}
function render(){
  if(!U.auth){U.mode='client';if(!['login','sms','lgName','master'].includes(U.cs))U.cs='login'}
  else if(U.auth.role!=='master')U.mode='client';
  const key=U.mode+U.cs+U.av;const fresh=U._rk!==key;U._rk=key;
  document.getElementById('app').innerHTML=U.mode==='client'?renderClient():renderAdmin();
  if(fresh)document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now();const st=n=>{const k=Math.min(1,(n-t0)/900),e=1-Math.pow(1-k,3);el.textContent=num(to*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
  centerStrip();
}
function startBook(zones,resched,bonus){U.bk={zones:[...zones],date:null,time:null,bonus:!!bonus,resched,y:T.getFullYear(),m:T.getMonth()};go('book')}

function icsFor(a){const d=a.date.replace(/-/g,''),t=a.time.replace(':','')+'00',e=mt(tm(a.time)+a.dur).replace(':','')+'00';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Studio//RU','BEGIN:VEVENT','UID:'+a.id+'@studio','DTSTAMP:'+d+'T000000','DTSTART:'+d+'T'+t,'DTEND:'+d+'T'+e,'SUMMARY:Лазерная эпиляция · Таня','DESCRIPTION:'+zn(a.zones),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Завтра визит к Тане','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}

  flip:(d,el)=>{hap();el.classList.toggle('flipped')},
  notif:()=>{hap();go('notif')},
  ics:d=>{const a=S.appts.find(x=>x.id===d.id);const b=new Blob([icsFor(a)],{type:'text/calendar'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='zapis-'+a.date+'.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Файл для календаря готов')},

  smsAgain:()=>{U.smsAt=Date.now();U.lgSms='';render();toast('Код отправлен ещё раз')},
  lgName:()=>{const n=U.lgName.trim();if(n.length<2)return;const d=digits(U.lgPhone);

  lgCode:async()=>{U.lgSms='';if(U.lgCode.length!==4)return;const h=await sha('studio:'+U.lgCode);if(h!==MASTER_H){U.lgCode='';render();toast('Неверный код');return}
    setAuth({role:'master',cid:U.cid||'c1'});U.mode='admin';U.av='ov';render();toast('Добрый день, Таня')},
  logout:()=>{if(!confirm('Выйти из аккаунта?'))return;setAuth(null);U.mode='client';U.cs='login';U.lgPhone='';U.lgName='';U.lgCode='';closeM();scrollTo(0,0);render()},
  reset:()=>{if(!confirm('Сбросить демо к началу? Сбросится и общая база для всех, кто открыл приложение.'))return;seed();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(DB.url)rpc('tanya_reset',{p_state:stateOf(),p_appts:S.appts}).then(t=>{DB.stateAt=t;dbMark(true)}).catch(()=>dbMark(false));try{localStorage.removeItem(LS+'_seen')}catch(e){}U.cs='login';U.hist=[];U.bk=null;render();toast('Демо сброшено')},
  toWelcome:()=>{U.cs='welcome';render()},
  toHome:()=>{try{localStorage.setItem(LS+'_seen','1')}catch(e){}U.cs=U.auth?'home':'login';U.hist=[];scrollTo(0,0);render()},
  replay:()=>{U.cs='splash';U.hist=[];scrollTo(0,0);render()},
  tab:d=>{U.cs=d.v;U.hist=[];U.bk=null;scrollTo(0,0);render()},
  back:()=>{U.cs=U.hist.pop()||'home';scrollTo(0,0);render()},
  cats:d=>{U.cat=d.v;if(U.cs!=='services')go('services');else render()},
  openZ:d=>{U.zone=d.id;go('service')},
  fav:()=>toast('Добавлено в избранное'),

  bookCourse:()=>{const c=C(U.cid);if(!c.course.zones.length){A.tab({v:'services'});return}if(upc(c.id).length){U.vt='act';A.tab({v:'visits'});return}startBook(c.course.zones)},
  vt:d=>{if(U.vt===d.v)return;hap();const sg=document.querySelector('.segc');if(sg)sg.dataset.i=d.v==='act'?0:1;setTimeout(()=>{U.vt=d.v;render()},200)},
  help:()=>modal(`<div class="row between"><div class="h2">Помощь и контакты</div><button class="ib" data-act="closeM">✕</button></div><div class="irow">${ic('map',18)} Адрес студии · уточнить у Тани</div><div class="irow">${ic('clock',18)} Пн–сб, ${S.settings.open}:00–${S.settings.close}:00</div><div class="irow">${ic('msg',18)} Написать Тане · мессенджер уточнить</div><div class="sm mut" style="margin-top:8px">Здесь же будет памятка «как подготовиться к сеансу», её напишет Таня.</div>`),
  cResched:d=>{const a=S.appts.find(x=>x.id===d.id);startBook(a.zones,a.id,a.bonusUsed)},
  cCancel:d=>{if(!confirm('Отменить запись?'))return;{const a=S.appts.find(x=>x.id===d.id);a.status='cancel';putAppt(a)}save();render();toast('Запись отменена, Таня увидит')},
  cRev:()=>{const c=C(U.cid);c.review=true;c.bonus+=S.settings.review;S.tx.push({cid:c.id,date:TODAY,amt:S.settings.review,note:'За отзыв на картах'});save();setTimeout(render,300)},
  bkM:d=>{const b=U.bk;b.m+=+d.v;if(b.m<0){b.m=11;b.y--}if(b.m>11){b.m=0;b.y++}render()},
  bkDate:d=>{U.bk.date=d.v;U.bk.time=null;render()},
  bkTime:d=>{U.bk.time=d.v;render()},
  bkNext:()=>go('confirm'),
  bkBonus:()=>{U.bk.bonus=!U.bk.bonus;render()},
  bkDone:()=>{const b=U.bk,c=C(U.cid);const price=zsum(b.zones,'price'),dur=zsum(b.zones,'dur');const max=Math.min(c.bonus,Math.floor(price*S.settings.maxShare/100));
    if(b.resched){const a=S.appts.find(x=>x.id===b.resched);Object.assign(a,{date:b.date,time:b.time,status:'new',zones:b.zones,dur,sum:price,bonusUsed:b.bonus?max:0});b.done=a.id;putAppt(a)}
    else{if(!c.course.total&&b.zones.some(z=>Z(z).m==='laser'))c.course={zones:[...b.zones],total:8,done:0,price:Math.round(price*8*(1-S.settings.courseDisc/100)/100)*100};const a={id:newId(),cid:c.id,date:b.date,time:b.time,zones:[...b.zones],dur,sum:price,status:'new',bonusUsed:b.bonus?max:0,session:Math.min(c.course.done+1,c.course.total)};S.appts.push(a);putAppt(a);b.done=a.id;
      const o=S.outreach.filter(o=>o.cid===c.id&&!o.booked).pop();if(o)o.booked=true}
    save();U.hist=[];U.cs='done';scrollTo(0,0);render()},
  copyTxt:d=>copy(d.t),
  av:d=>{U.av=d.v;scrollTo(0,0);render()},
  wk:d=>{U.wk=+d.v===0?0:U.wk+(+d.v);render()},
  msgTab:d=>{U.mt=d.v;U.av='msg';render()},
  apptM:d=>apptModal(d.id),
  openC:d=>openClient(d.id),
  write:d=>writeModal(d.id,d.k),
  copyMsg:()=>copy(document.getElementById('msgT').innerText),
  sent:d=>{S.outreach.push({cid:d.id,kind:d.k,date:TODAY,booked:false});if(d.k==='review')C(d.id).review=true;save();closeM();render();toast('Отмечено. Клиент уйдёт из списка на неделю')},
  closeM:()=>{closeM();render()},
  aSt:d=>{const a=S.appts.find(x=>x.id===d.id);a.status=d.v;if(d.v==='done')earn(a);putAppt(a);save();closeM();render();toast({ok:'Запись подтверждена, клиент получит уведомление',done:'Визит отмечен, бонусы начислены',noshow:'Отмечено: не пришла',cancel:'Заявка отклонена'}[d.v])},
  newAppt:d=>newAppt(d.id||'',d.date,d.time),
  naPick:d=>{const n=U.na;n.cid=d.id;n.zones=d.id?[...C(d.id).course.zones]:[];n.q='';naRender()},

    S.appts.push({id:newId(),cid:c.id,date:n.date,time:n.time,zones:[...n.zones],dur:zsum(n.zones,'dur'),sum:zsum(n.zones,'price'),status:'ok',bonusUsed:0,session:Math.min(c.course.done+1,c.course.total)});putAppt(S.appts[S.appts.length-1]);
    const o=S.outreach.filter(o=>o.cid===c.id&&!o.booked).pop();if(o)o.booked=true;

  cv:d=>{if(U.cv===d.v)return;const sg=document.querySelector('.segc');if(sg)sg.dataset.i=d.v==='day'?0:1;setTimeout(()=>{U.cv=d.v;render()},180)},

};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f){if(el.classList.contains('dk')||el.closest('.tabbar')||el.classList.contains('slot'))hap();if(el.tagName!=='A')e.preventDefault();e.stopPropagation();f(el.dataset,el,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.inp){const k=t.dataset.inp;U[k]=t.value;const p=t.selectionStart;render();const i=document.querySelector(`[data-inp=${k}]`);if(i){i.focus();i.setSelectionRange(p,p)}}
  if(t.dataset.nq){U.na.q=t.value;const r=document.getElementById('naRes');if(r)r.innerHTML=naRes();return}
  if(t.dataset.tpl){S.settings.tpl[t.dataset.tpl]=t.value;save()}

});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chg==='cid'){U.cid=t.value;U.cs='home';U.hist=[];render();scrollTo(0,0)}

});

load();if(location.hash==='#reset'){seed();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}history.replaceState(null,'',location.pathname)}render();boot();

/* жест «назад» от левого края и шторка вниз */
let tx0=null,ty0=null,mEl=null;
addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;mEl=e.target.closest('.modal');if(mEl&&mEl.scrollTop>0)mEl=null},{passive:true});
addEventListener('touchmove',e=>{if(!mEl)return;const dy=e.touches[0].clientY-ty0;if(dy>0){mEl.style.transition='none';mEl.style.transform=`translateY(${dy}px)`}},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tx0,dy=t.clientY-ty0;

  tx0=null},{passive:true});
